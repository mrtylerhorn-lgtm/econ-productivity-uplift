name: Probe data sources
on:
  workflow_dispatch:
  push:
    paths: ["tools/probe.py", "probe/ids.txt", "probe/queries.txt"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py
      - run: |
          git config user.name "data-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/result.md; git commit -m "Probe results" || exit 0; git push
