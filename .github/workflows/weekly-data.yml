name: Weekly data update

on:
  schedule:
    - cron: "17 21 * * 5"   # Fridays 21:17 UTC = Saturdays 06:17 Tokyo, before the Claude task at 08:33
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch.py"
      - ".github/workflows/weekly-data.yml"

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Fetch latest data
        run: python3 tools/fetch.py
      - name: Compute facts, scorecard and verdict
        run: python3 tools/build.py --data-only --log-history
      - name: Commit if anything changed
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(TZ=Asia/Tokyo date +%F)"
          git push
